[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jigsaw-bench"
version = "0.1.0"
description = "Jigsaw puzzle generation, scattering, and AI benchmarking environment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pillow>=9.0",
    "matplotlib>=3.5",
    "shapely>=2.0",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/jerod92/jigsaw-bench"
Issues = "https://github.com/jerod92/jigsaw-bench/issues"

[tool.setuptools.packages.find]
include = ["jigsaw_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Kaggle bootstrap scripts must clone + install the repo before importing it,
# so module-level imports legitimately follow runtime setup code.
"examples/kaggle_*.py" = ["E402"]
